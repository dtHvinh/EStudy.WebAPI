name: estudy

services:
  webapi:
    image: ${DOCKER_REGISTRY-}webapi
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    depends_on:
      - postgres
      - redis
      - minio
      - minio-init
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Postgre=Host=postgres;Port=5432;Database=estudy;Username=postgres;Password=postgres;
      - ConnectionStrings__Redis=redis:6379
      - Minio__Url=minio:9000
      - Minio__BucketName=estudy
      - Minio__AccessKey=admin
      - Minio__SecretKey=password

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=estudy
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T00-00-00Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/mc alias set local http://minio:9000 admin password;
        /usr/bin/mc mb -p local/estudy || true;
        /usr/bin/mc anonymous set download local/estudy || true;
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
